\* Counterexample witness for the L19 placement guard. With RetryPlacementGuard
\* FALSE, a retry accepts an open same-run lease without checking that its
\* immutable node/slots match the scheduler's new node: the first PreBind lease
\* stays on n1 while the retried pod binds on n2. Production now ships the guard
\* (plugin.PreBind's AlreadyExists branch), so this config exists to keep the
\* violation reachable and prove the guard is load-bearing, not to model live
\* behaviour.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = FALSE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANT BoundLeaseMatchesPodNode
