\* Current production accepts an open same-run lease on retry without checking
\* that its immutable node/slots match the scheduler's new node. The first
\* PreBind lease stays on n1 while the retried pod binds on n2.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = FALSE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANT BoundLeaseMatchesPodNode
