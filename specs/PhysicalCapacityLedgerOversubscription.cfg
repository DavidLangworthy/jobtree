\* Legal witness rejected by pkg/invariant: two open leases may repeat the same
\* node#ordinal string. The pods are physically on different nodes and capacity
\* remains safe; lease ordinals are not device identity.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "LedgerOversubscription"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = TRUE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANTS
  TypeOK
  MachinePlaneConsistent
  PhysicalCapacitySafe
  OneMachineLivePodPerRank
  NoDuplicateOpenLeaseSlots
