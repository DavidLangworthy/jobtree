\* PrepareSwap closes the spare and blocker leases while both pods are still
\* terminating on n2. Counting those closed accounting records as physical
\* release lets Swap bind as a third machine-live GPU request.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = TRUE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = TRUE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANT PhysicalCapacitySafe
