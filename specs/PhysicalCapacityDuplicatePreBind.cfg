\* Repeating PreBind for one pod and incarnation must converge on the same lease
\* name. Without idempotency/nonce protection it mints twice.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = FALSE
  RetryPlacementGuard = TRUE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANT OneMintPerPodAndNonce
