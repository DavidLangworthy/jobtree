\* PreBind succeeds, Kubernetes Bind fails, and Unreserve forgets the scheduler
\* assumption. If a caller may declare the episode finished without retrying or
\* closing the minted lease, a non-physical pod keeps charging.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = TRUE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = TRUE
  RequireBindFailureCleanup = FALSE
  MaxSteps = 14

INVARIANT QuiescentHasNoChargingOrphan
