\* The controller has only requested deletion of the spare and blocker pods.
\* If the hard-pinned swap trusts that planned handoff and skips the scheduler's
\* real capacity check, it can bind while both terminating pods still hold n2.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  InitMode = "Lifecycle"
  AtomicCapacityCommit = TRUE
  ClosedLeaseFreesPhysical = FALSE
  MaterializationGuard = TRUE
  SwapChecksCapacity = FALSE
  IdempotentPreBind = TRUE
  RetryPlacementGuard = TRUE
  RequireBindFailureCleanup = TRUE
  MaxSteps = 14

INVARIANT PhysicalCapacitySafe
