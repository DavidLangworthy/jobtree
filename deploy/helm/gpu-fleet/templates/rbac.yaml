{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount }}
  labels: {{- include "gpu-fleet.labels" . | nindent 4 }}
---
# Scoped to exactly what the manager uses (R22): the jobtree CRDs plus their
# status, read on nodes (node-failure watch), pods (the binder creates and
# reclaims them), events, and coordination.k8s.io leases for leader election
# (a DIFFERENT resource from our gpuleases — R13 renamed ours precisely so this
# rule cannot be confused for that one). No
# wildcard rules — the CI helm-template check asserts this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fleet.controllerName" . }}
rules:
  - apiGroups: ["rq.davidlangworthy.io"]
    resources: ["budgets", "runs", "reservations", "gpuleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rq.davidlangworthy.io"]
    resources: ["budgets/status", "runs/status", "reservations/status", "gpuleases/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # R9 9A-1: one headless Service per Run for rendezvous DNS. The controller creates
  # it; the apiserver GCs it via the Run ownerRef, so no delete verb is needed here.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-fleet.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-fleet.controllerName" . }}
{{- end }}
{{- if .Values.rbac.create }}
---
# DESIGN-v5 build item 1 (Ruling 17) — the grantor/grantee split.
#
# Delegation is a SEPARATE RESOURCE from allocation, and this file is the reason
# why. RBAC is per-resource, not per-field: if "what I give away" were a field on
# Budget, then anyone who could delegate could also raise their own concurrency,
# because both would need `update` on budgets. Splitting Grant out means a lead
# can sub-divide what they hold without ever holding the verb that would enlarge
# it.
#
# So the load-bearing property of this ClusterRole is what it does NOT contain:
# there is no create/update/patch/delete on `budgets`. Read-only on budgets is
# deliberate — a lead must be able to SEE their allocation to divide it sensibly,
# and must not be able to change it. `hack/ci/helm-assertions.sh` asserts the
# absence, because an absence nothing checks is an absence that comes back.
#
# Bind it with a RoleBinding (not a ClusterRoleBinding), which is what scopes the
# grantor to their OWN namespace: `Grant` lives in the grantor's namespace and
# DESIGN-v5 §2c derives the grantor from that namespace's immutable UID rather
# than from any writable field, so namespace-scoped write access IS the authority
# check. `.Values.rbac.grantors` renders those bindings.
#
# WHAT THIS DOES NOT PROMISE (Ruling 17, verbatim): it does not prevent a lead
# from enlarging the allocation THEY control. Nothing here models one human
# holding two principals — an actor with namespaces A and B can write `B -> A`
# and every check passes. Ruling 9 places that outside Kubernetes. Do not read
# this Role as a containment guarantee it does not provide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fleet.controllerName" . }}-grantor
  labels: {{- include "gpu-fleet.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rq.davidlangworthy.io"]
    resources: ["grants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only, on purpose. See the note above: this is the half of the split
  # that keeps sub-division from becoming self-enlargement.
  - apiGroups: ["rq.davidlangworthy.io"]
    resources: ["budgets"]
    verbs: ["get", "list", "watch"]
---
# The grantee half: see what you hold and what authorised it, change neither.
# A grantee needs to read the Grant naming them to understand why their
# allocation is what it is ("why is my job Unfunded?", DESIGN-v5 §10), but a
# grantee who could write Grants could grant to themselves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fleet.controllerName" . }}-grantee
  labels: {{- include "gpu-fleet.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rq.davidlangworthy.io"]
    resources: ["grants", "budgets"]
    verbs: ["get", "list", "watch"]
{{- range .Values.rbac.grantors }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-fleet.controllerName" $ }}-grantor
  namespace: {{ .namespace }}
  labels: {{- include "gpu-fleet.labels" $ | nindent 4 }}
subjects: {{- toYaml .subjects | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-fleet.controllerName" $ }}-grantor
{{- end }}
{{- range .Values.rbac.grantees }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-fleet.controllerName" $ }}-grantee
  namespace: {{ .namespace }}
  labels: {{- include "gpu-fleet.labels" $ | nindent 4 }}
subjects: {{- toYaml .subjects | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-fleet.controllerName" $ }}-grantee
{{- end }}
{{- end }}
